@if(courseService.loading()) {
  <div>Laddar...</div>
}

@if(courseService.error()) {
  <p class="error">{{ courseService.error() }}</p>
}

<table>
  <thead>
    <tr>
      <th>Kurskod</th>
      <th>Kursnamn</th>
      <th>Progression</th>
    </tr>
  </thead>

  <tbody>
    @for(course of courseService.courses(); track course.code) {
    <tr>
      <td>{{ course.code }}</td>
      <td>
        <a [href]="course.syllabus" target="_blank">{{ course.coursename }}</a>
      </td>
      <td>{{ course.progression }}</td>
    </tr>
    }

  </tbody>

</table>
